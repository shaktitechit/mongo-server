# =============================================================================
# mongod.conf — Production-oriented MongoDB Community configuration
#
# Mounted read-only into the container at /etc/mongod.conf
# Docs: https://www.mongodb.com/docs/manual/reference/configuration-options/
#
# IMPORTANT — Authentication:
# Do NOT set security.authorization here. The official mongo image enables
# --auth automatically when MONGO_INITDB_ROOT_USERNAME / PASSWORD are set.
# Enabling authorization in this file breaks first-boot initialization.
# =============================================================================

# -----------------------------------------------------------------------------
# Storage
# -----------------------------------------------------------------------------
storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      # Leave cache unset so mongod auto-sizes (~50% of RAM - 1GB, min 256MB).
      # On a dedicated VPS you may set cacheSizeGB explicitly, e.g.:
      # cacheSizeGB: 2
      directoryForIndexes: false
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

# -----------------------------------------------------------------------------
# Networking
# Bind to all interfaces *inside* the container. Public exposure is controlled
# by Docker port publishing (prefer 127.0.0.1:27017 on the host).
# -----------------------------------------------------------------------------
net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 200
  ipv6: false

# -----------------------------------------------------------------------------
# Process management
# Docker manages the process; do not fork or use a PID file.
# -----------------------------------------------------------------------------
processManagement:
  timeZoneInfo: /usr/share/zoneinfo

# -----------------------------------------------------------------------------
# Logging
# Omit systemLog so foreground mongod writes to the container stdout/stderr,
# which `docker compose logs -f mongodb` captures.
# (systemLog.destination only accepts 'file' or 'syslog' — not 'stdout'.)
# To log to a host file instead, uncomment and mount ./logs:
# systemLog:
#   destination: file
#   path: /var/log/mongodb/mongod.log
#   logAppend: true
#   logRotate: reopen
#   verbosity: 0

# -----------------------------------------------------------------------------
# Operation profiling (optional; keep off unless investigating slow queries)
# -----------------------------------------------------------------------------
operationProfiling:
  mode: off
  # slowOpThresholdMs: 100
  # mode: slowOp
