name: CI & Deployment Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Validate Configuration & Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy .env.example to .env for validation
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_[a-zA-Z0-9_]*/test_secure_password_12345/g' .env

      - name: Validate Docker Compose syntax
        run: |
          docker compose config --quiet

      - name: Check bash script syntax
        run: |
          bash -n scripts/*.sh
